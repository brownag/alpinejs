  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.8/dist/cdn.min.js"></script>
  <style>
    /* 1990s Web 1.0 aesthetic - authentic retro feel */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Verdana, Geneva, sans-serif;
      line-height: 1.6;
      color: #000;
      background: #c0c0c0;
      font-size: 14px;
    }

    /* Header & Navigation */
    header {
      background: #dfdfdf;
      border: 2px solid;
      border-color: #dfdfdf #808080 #808080 #dfdfdf;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    header h1 {
      font-size: 1.8rem;
      margin-bottom: 0.8rem;
      font-weight: bold;
      border-bottom: 3px double #0000ff;
      padding-bottom: 0.3rem;
    }

    nav {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      border-top: 1px solid #dfdfdf;
      padding-top: 0.8rem;
    }

    nav a {
      color: #0000ff;
      text-decoration: underline;
      font-size: 0.9rem;
      font-weight: bold;
    }

    nav a:visited {
      color: #800080;
    }

    nav a:hover {
      background: #0000ff;
      color: #fff;
    }

    /* Main content */
    main {
      max-width: 900px;
      margin: 0 auto 2rem;
      padding: 1rem;
      background: #fff;
      border: 2px solid;
      border-color: #dfdfdf #808080 #808080 #dfdfdf;
      min-height: calc(100vh - 250px);
    }

    /* Headings */
    h1, h2, h3, h4, h5, h6 {
      margin: 1.5rem 0 0.5rem;
      font-weight: bold;
      line-height: 1.3;
    }

    h1 { 
      font-size: 2rem;
      border-bottom: 3px double #0000ff;
      padding-bottom: 0.3rem;
      margin-top: 0;
      color: #0000ff;
    }

    h2 { 
      font-size: 1.4rem;
      color: #0000cc;
      border-bottom: 1px solid #000;
    }

    h3 { font-size: 1.1rem; color: #000080; }
    h4 { font-size: 1rem; color: #000; font-weight: bold; }

    /* Paragraphs & text */
    p {
      margin-bottom: 1rem;
      line-height: 1.6;
    }

    a {
      color: #0000ff;
      text-decoration: underline;
    }

    a:visited {
      color: #800080;
    }

    a:hover {
      background: #0000ff;
      color: #fff;
    }

    /* Inline code */
    code {
      background: #f0f0f0;
      padding: 2px 4px;
      font-family: "Courier New", monospace;
      font-size: 0.9em;
      color: #000;
      border: 1px solid #ccc;
    }

    /* Code blocks */
    pre {
      background: #f0f0f0;
      border: 1px solid #999;
      padding: 1rem;
      overflow-x: auto;
      margin: 1rem 0;
      line-height: 1.4;
      font-family: "Courier New", monospace;
      font-size: 0.9em;
    }

    pre code {
      background: none;
      padding: 0;
      color: #000;
      border: none;
    }

    /* Lists */
    ul, ol {
      margin-left: 2rem;
      margin-bottom: 1rem;
    }

    li {
      margin-bottom: 0.3rem;
    }

    /* Blockquotes */
    blockquote {
      border-left: 4px solid #999;
      padding-left: 1rem;
      margin: 1rem 0;
      color: #333;
      font-style: italic;
      background: #f5f5f5;
    }

    hr {
      border: none;
      border-top: 1px solid #999;
      margin: 1.5rem 0;
    }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
      border: 1px solid #999;
      font-size: 0.9em;
    }

    th, td {
      padding: 0.6rem;
      text-align: left;
      border: 1px solid #999;
    }

    th {
      background: #c0c0c0;
      font-weight: bold;
      border-color: #dfdfdf #808080 #808080 #dfdfdf;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 1rem;
      border-top: 1px solid #999;
      border: 2px solid;
      border-color: #dfdfdf #808080 #808080 #dfdfdf;
      color: #000;
      font-size: 0.85rem;
      margin: 2rem 1rem 0;
      background: #dfdfdf;
    }

    footer a {
      color: #0000ff;
      text-decoration: underline;
    }

    footer a:visited {
      color: #800080;
    }

    /* Horizontal rule dividers */
    .divider {
      border: none;
      height: 2px;
      background: linear-gradient(to right, #dfdfdf 0%, #000 50%, #dfdfdf 100%);
      margin: 1.5rem 0;
    }

    /* Responsive */
    @media (max-width: 640px) {
      main {
        padding: 0.8rem;
      }

      header {
        padding: 0.8rem;
      }

      nav {
        gap: 0.5rem;
        font-size: 0.85rem;
      }

      h1 { font-size: 1.4rem; }
      h2 { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1><a href="../index.html" style="color: #000; text-decoration: none;">alpinejs</a></h1>
    <nav>
      <a href="../index.html">Home</a>
      <a href="../guides/">Guides</a>
      <a href="../examples/">Examples</a>
      <a href="../reference/">Reference</a>
      <a href="https://github.com/brownag/alpinejs" target="_blank">GitHub</a>
    </nav>
  </header>

  <main>
    
<div class="frontmatter">
<div class="title"><h1>Example: Todo List Application</h1></div>
</div>
<div class="body">
<div class="todo-container" style="max-width: 600px; margin: 40px auto; font-family: sans-serif;" x-init="todos = JSON.parse(localStorage.getItem(&#39;todos&#39;) || &#39;[]&#39;)" x-data="{&quot;newTodo&quot;:&quot;&quot;,&quot;filter&quot;:&quot;all&quot;,&quot;todos&quot;:[],&quot;addTodo&quot;:function() { if (!this.newTodo.trim()) return; this.todos.push({ id: Date.now(), text: this.newTodo, completed: false }); this.newTodo = &#39;&#39;; this.saveTodos(); },&quot;deleteTodo&quot;:function(id) { this.todos = this.todos.filter(t => t.id !== id); this.saveTodos(); },&quot;saveTodos&quot;:function() { localStorage.setItem(&#39;todos&#39;, JSON.stringify(this.todos)); },&quot;filterTodos&quot;:function(filterType) { if (filterType === &#39;active&#39;) { return this.todos.filter(t => !t.completed); } else if (filterType === &#39;completed&#39;) { return this.todos.filter(t => t.completed); } return this.todos; },&quot;filteredTodos&quot;:function() { return this.filterTodos(this.filter); },&quot;activeTodos&quot;:function() { return this.todos.filter(t => !t.completed).length; },&quot;completedTodos&quot;:function() { return this.todos.filter(t => t.completed).length; }}">
  <h1 id="chp:todo-list" style="color: #333; margin-bottom: 20px;">Todo List</h1>
  <div style="display: flex; gap: 10px; margin-bottom: 20px;">
    <input type="text" placeholder="What needs to be done?" style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px;" x-model.trim="newTodo"/>
    <button style="padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;" @click="addTodo()">Add</button>
  </div>
  <div style="display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
    <button style="background: none; border: none; cursor: pointer; padding: 8px; border-bottom: 2px solid transparent;" @click="filter = &#39;all&#39;" x-bind:style="filter === &#39;all&#39; ? &#39;border-bottom-color: #007bff; color: #007bff;&#39; : &#39;color: #777;&#39;">All</button>
    <button style="background: none; border: none; cursor: pointer; padding: 8px; border-bottom: 2px solid transparent;" @click="filter = &#39;active&#39;" x-bind:style="filter === &#39;active&#39; ? &#39;border-bottom-color: #007bff; color: #007bff;&#39; : &#39;color: #777;&#39;">Active</button>
    <button style="background: none; border: none; cursor: pointer; padding: 8px; border-bottom: 2px solid transparent;" @click="filter = &#39;completed&#39;" x-bind:style="filter === &#39;completed&#39; ? &#39;border-bottom-color: #007bff; color: #007bff;&#39; : &#39;color: #777;&#39;">Completed</button>
  </div>
  <template x-for="todo in filteredTodos()" x-key="todo.id">
    <div style="display: flex; align-items: center; padding: 12px; border: 1px solid #eee; margin-bottom: 8px; border-radius: 4px; background: white;">
      <input type="checkbox" style="margin-right: 12px; cursor: pointer; width: 20px; height: 20px;" x-bind:checked="todo.completed" @change="todo.completed = $el.checked; saveTodos()"/>
      <span style="flex: 1;" x-text="todo.text" x-bind:style="todo.completed ? &#39;text-decoration: line-through; color: #999;&#39; : &#39;color: #333;&#39;"></span>
      <button style="background: none; border: none; color: #dc3545; cursor: pointer; font-size: 24px; padding: 0; width: 30px; height: 30px;" @click="deleteTodo(todo.id)">×</button>
    </div>
  </template>
  <div style="margin-top: 20px; padding-top: 10px; border-top: 1px solid #eee; color: #666; font-size: 14px;">
    <span x-text="&#39;Active: &#39; + activeTodos() + &#39;, Completed: &#39; + completedTodos()"></span>
  </div>
</div>
</div>
<nav style="margin-bottom: 1.5rem; font-size: 0.9em;">
      <a href="../index.html" style="color: #0000ff; text-decoration: underline;">Home</a> &gt;
      <a href="../examples/index.html" style="color: #0000ff; text-decoration: underline;">Examples</a> &gt;
      <span style="color: #666;">TODO List</span>
      </nav>
  </main>

  <footer>
    <p>
      alpinejs &mdash; R interface for Alpine.js<br>
      <a href="https://github.com/brownag/alpinejs">View on GitHub</a>
    </p>
  </footer>
</body>
</html>
