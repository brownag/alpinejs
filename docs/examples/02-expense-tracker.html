    /* Headings */

      margin: 1.5rem 0 0.5rem;

    }

    h1 { 
      font-size: 2rem;
      border-bottom: 3px double #0000ff;
      padding-bottom: 0.3rem;
      margin-top: 0;
      color: #0000ff;
    }

    h2 { 
      font-size: 1.4rem;

    /* Paragraphs & text */
    p {

    a {

    code {

    /* Lists */

  <header>
    <h1><a href="../index.html" style="color: #000; text-decoration: none;">alpinejs</a></h1>
    <nav>
      <a href="../index.html">Home</a>
      <a href="../guides/">Guides</a>

  <main>
    
<div class="frontmatter">
<div class="title"><h1>Example: Expense Tracker</h1></div>
</div>
<div class="body">
<div class="expense-container" style="max-width: 700px; margin: 40px auto; font-family: sans-serif;" x-data="{&quot;transactionType&quot;:&quot;expense&quot;,&quot;newAmount&quot;:0,&quot;newCategory&quot;:&quot;food&quot;,&quot;newDescription&quot;:&quot;&quot;,&quot;transactions&quot;:[],&quot;totalIncome&quot;:function() { return this.transactions .filter(t => t.type === &#39;income&#39;) .reduce((sum, t) => sum + t.amount, 0); },&quot;totalExpense&quot;:function() { return this.transactions .filter(t => t.type === &#39;expense&#39;) .reduce((sum, t) => sum + t.amount, 0); },&quot;balance&quot;:function() { return this.totalIncome() - this.totalExpense(); },&quot;addTransaction&quot;:function() { if (this.newAmount <= 0 || !this.newCategory) return; const transaction = { type: this.transactionType, amount: parseFloat(this.newAmount), category: this.newCategory, description: this.newDescription, date: new Date().toLocaleDateString() }; this.transactions.push(transaction); this.newAmount = 0; this.newCategory = &#39;food&#39;; this.newDescription = &#39;&#39;; },&quot;deleteTransaction&quot;:function(idx) { this.transactions.splice(idx, 1); }}">
  <h1 id="chp:expense-tracker" style="color: #333; margin-bottom: 10px;">Expense Tracker</h1>
  <p style="color: #666; margin-bottom: 20px;">Track income and expenses with categories</p>
  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px;">
    <div class="stat-card" style="background-color: #d4edda; padding: 16px; border-radius: 8px; text-align: center; color: #28a745; ">
      <div style="font-size: 14px; font-weight: 500; margin-bottom: 8px;opacity: 0.8;">Income</div>
      <div style="font-size: 28px; font-weight: bold; color: #28a745;" x-text="&#39;$&#39; + totalIncome().toFixed(2)"></div>
    </div>
    <div class="stat-card" style="background-color: #f8d7da; padding: 16px; border-radius: 8px; text-align: center; color: #dc3545; ">
      <div style="font-size: 14px; font-weight: 500; margin-bottom: 8px;opacity: 0.8;">Expenses</div>
      <div style="font-size: 28px; font-weight: bold; color: #dc3545;" x-text="&#39;$&#39; + totalExpense().toFixed(2)"></div>
    </div>
    <div class="stat-card" style="background-color: #cfe2ff; padding: 16px; border-radius: 8px; text-align: center; color: #0d6efd; ">
      <div style="font-size: 14px; font-weight: 500; margin-bottom: 8px;opacity: 0.8;">Balance</div>
      <div style="font-size: 28px; font-weight: bold; color: #0d6efd;" x-text="&#39;$&#39; + balance().toFixed(2)"></div>
    </div>
  </div>
  <div style="background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 30px;">
    <h3 id="sec:add-transaction" style="margin-top: 0; color: #333;">Add Transaction</h3>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
      <label style="cursor: pointer;">
        <input type="radio" value="income" x-model="transactionType"/>
        Income
      </label>
      <label style="cursor: pointer;">
        <input type="radio" value="expense" x-model="transactionType"/>
        Expense
      </label>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
      <div>
        <label style="display: block; margin-bottom: 5px; color: #666; font-size: 14px;">Amount</label>
        <input type="number" placeholder="0.00" step="0.01" min="0" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;" x-model.number="newAmount"/>
      </div>
      <div>
        <label style="display: block; margin-bottom: 5px; color: #666; font-size: 14px;">Category</label>
        <select style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;" x-model="newCategory">
          <option value="salary">Salary</option>
          <option value="bonus">Bonus</option>
          <option value="food" selected>Food</option>
          <option value="transport">Transport</option>
          <option value="utilities">Utilities</option>
          <option value="entertainment">Entertainment</option>
          <option value="other">Other</option>
        </select>
      </div>
    </div>
    <div style="margin-bottom: 15px;">
      <label style="display: block; margin-bottom: 5px; color: #666; font-size: 14px;">Description</label>
      <input type="text" placeholder="Optional notes" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;" x-model.trim="newDescription"/>
    </div>
    <button style="background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold;" @click="addTransaction()" x-bind:disabled="newAmount <= 0 || !newCategory">Add Transaction</button>
  </div>
  <div>
    <h3 id="sec:transactions" style="color: #333; margin-bottom: 15px;">Transactions</h3>
    <template x-for="(transaction, idx) in transactions" x-key="idx">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 1px solid #eee; margin-bottom: 8px; border-radius: 4px; background: white;">
        <div style="flex: 1;">
          <div style="font-weight: 500; color: #333;" x-text="transaction.description || transaction.category"></div>
          <div style="font-size: 12px; color: #999;" x-text="transaction.category"></div>
        </div>
        <div x-text="&#39;$&#39; + transaction.amount.toFixed(2)" x-bind:style="transaction.type === &#39;income&#39; ? &#39;color: #28a745; font-weight: bold;&#39; : &#39;color: #dc3545; font-weight: bold;&#39;"></div>
        <button style="background: none; border: none; color: #dc3545; cursor: pointer; font-size: 20px; padding: 0;" @click="deleteTransaction(idx)">×</button>
      </div>
    </template>
  </div>
</div>
</div>
<nav style="margin-bottom: 1.5rem; font-size: 0.9em;">

      <span style="color: #666;">Expense Tracker</span>

  </main>

  <footer>

  </footer>
</body>
</html>
